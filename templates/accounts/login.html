{% extends 'base.html' %}
{% load static %}

{% block title %}Iniciar Sesión | MangoLeaf-AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="custom-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.3rem;">
            <i class="fa-solid fa-leaf"></i>
          </div>
          <h3 class="fw-bold text-dark">Iniciar Sesión</h3>
          <p class="text-muted small">Accede a tu cuenta para registrar y consultar tu historial foliar.</p>
        </div>

        <form method="POST" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
          {% csrf_token %}

          <div class="mb-3">
            <label for="id_username" class="form-label small fw-semibold text-dark">Nombre de usuario</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
              <input type="text" name="username" id="id_username" class="form-control" placeholder="Ingrese su usuario" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="id_password" class="form-label small fw-semibold text-dark">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
              <input type="password" name="password" id="id_password" class="form-control" placeholder="Ingrese su contraseña" required>
            </div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-emerald btn-lg py-2 fw-semibold" id="btn-login-submit">
              Ingresar al Sistema
            </button>
          </div>

          <div class="text-center small text-muted">
            ¿Aún no tienes una cuenta? <a href="{% url 'accounts:register' %}" class="text-success fw-semibold text-decoration-none">Regístrate aquí</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
